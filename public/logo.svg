<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#6B1728"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  {/* Background */}
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="110" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.6"/>

  {/* Subtle basketball lines in background */}
  <circle cx="256" cy="256" r="180" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.15"/>
  <path d="M76 256h360M256 76v360" stroke="#F59E0B" stroke-width="3" opacity="0.15"/>

  {/* Central Basketball Silhouette */}
  <g filter="url(#glow)">
    <circle cx="256" cy="240" r="110" fill="url(#ballGrad)" opacity="0.9"/>
    {/* Ball seam lines */}
    <path d="M146 240c60-40 160-40 220 0M146 240c60 40 160 40 220 0M256 130c40 60 40 160 0 220M256 130c-40 60-40 160 0 220" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
  </g>

  {/* Dynamic Shield / Trophy Emblem */}
  <path d="M256 70l120 45v130c0 80-60 145-120 170-60-25-120-90-120-170V115z" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round"/>

  {/* Typography banner or text imrt */}
  <text x="256" y="445" font-family="'Oswald', sans-serif" font-weight="700" font-size="52" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">IMRT 3x3</text>
  <text x="256" y="480" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#F59E0B" letter-spacing="4" text-anchor="middle">CHAMPIONSHIP</text>
</svg>
